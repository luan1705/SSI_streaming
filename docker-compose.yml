  trade_history_indice:      { <<: *trade_history, container_name: trade_history_indice,      environment: { SYMBOL_NAME: "INDICE" } }
  trade_history_etfhose:     { <<: *trade_history, container_name: trade_history_etfhose,     environment: { SYMBOL_NAME: "ETFHOSE" } }
